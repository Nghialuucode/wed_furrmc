<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💖 For Dyn ✨</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══════════ LANDING SCREEN ══════════ -->
  <div id="landing" class="landing">
    <div class="landing-stars"></div>
    <div class="landing-content">
      <h1 class="landing-title">For <span>Dyn</span></h1>
      <p class="landing-sub">♡ A Universe Made For You ♡</p>
      <button id="startBtn" class="start-btn">
        <span class="btn-text">💖 Chạm để bắt đầu 💖</span>
      </button>
      <p class="landing-hint">♪ Bật âm thanh để có trải nghiệm trọn vẹn ♪</p>
    </div>
  </div>

  <!-- ══════════ EXPERIENCE ══════════ -->
  <div id="experience" class="experience">
    <canvas id="webgl"></canvas>
    
    <!-- Lyrics -->
    <div id="lyrics" class="lyrics"></div>

    <!-- Message Popup -->
    <div id="messagePopup" class="message-popup"></div>
  </div>

  <!-- AUDIO -->
  <audio id="bgMusic" preload="auto" loop>
    <source src="assets/music.mp3" type="audio/mpeg" />
  </audio>

  <!-- THREE.JS IMPORT MAP -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
